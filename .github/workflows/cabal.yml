name: Cabal build

# Determinism ladder for the Cabal build (bsc.cabal, cabal.project,
# SetupHooks.hs) and the installed bluehs runtime (util/bluehs).
#
# Runs `util/cabal-ladder.sh run` on a single runner per platform so every leg
# shares the same host environment: six fresh checkouts (`c-j1` reference,
# `a-j1`, `c-j16`, `c-j64`, `a-j64`, `d-j64`) plus in-place rebuild/edit/revert
# rounds on the serial legs. On GHC >= 9.12 (`-fobject-determinism`), legs vary
# both GHC and Cabal parallelism; on older GHC, legs vary Cabal package jobs
# and checkout paths.
#
# Triggered on B-Lang-org/bsc PRs touching build files, nightly on the default
# branch, and via workflow_dispatch (including on forks). Ordinary source
# changes do not trigger this workflow; `src/comp/check-warmup-roots.sh` checks
# the root-module Warmup import invariant on every PR.

on:
  pull_request:
    paths:
      - cabal.project
      - bsc.cabal
      - SetupHooks.hs
      - util/cabal-ladder.sh
      - util/bluehs/**
      - GNUmakefile
      - .github/workflows/cabal.yml
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      ghc_version:
        description: GHC version (from 9.12 on, legs vary GHC parallelism and run the edit/revert round)
        required: false
        default: '9.14.1'
        type: string
      platforms:
        description: Runners to build on
        required: false
        default: both
        type: choice
        options: [both, ubuntu, macos]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ladder:
    name: "Ladder ${{ matrix.os }}"
    # Run on B-Lang-org/bsc PRs/schedule, or when manually dispatched.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'B-Lang-org/bsc' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'ubuntu' && '["ubuntu-24.04"]' || inputs.platforms == 'macos' && '["macos-15"]' || '["ubuntu-24.04","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    # Six legs plus serial rebuild rounds take ~2h on ubuntu-24.04 and ~4h on macos-15.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo .github/workflows/install_dependencies_ubuntu.sh
          # Needed by util/bluehs/mk-dist.sh to rewrite RPATHs and bundle libraries.
          sudo apt-get install -y patchelf cpio
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          .github/workflows/install_dependencies_macos.sh
          # Workaround matching build-and-test-macos.yml: remove stray
          # /usr/local/include/tcl.h so it does not shadow system Tcl.
          rm -f /usr/local/include/tcl.h
      # Pin cabal-install 3.16.1.0 for jsem v1 compatibility with GHC 9.8-9.14.1
      # (cabal-install 3.18+ requires jsem v2 from GHC 9.10.4/9.12.5/9.14.2+).
      - name: Install GHC
        uses: haskell/ghcup-setup@v1
        with:
          ghc: ${{ inputs.ghc_version || '9.14.1' }}
          cabal: 3.16.1.0
      - name: Update the package index
        run: cabal update
      - name: The ladder
        env:
          OUT: ${{ github.workspace }}/determinism-results
        run: util/cabal-ladder.sh run
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: ladder-${{ matrix.os }}
          path: |
            determinism-results/*.sha256
            determinism-results/*.toolchain
            determinism-results/*.log
            determinism-results/*.rc
          if-no-files-found: error
