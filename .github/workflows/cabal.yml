name: Cabal build

# The cabal build of the compiler (bsc.cabal, cabal.project, SetupHooks.hs)
# and its determinism ladder: the same commit built serially, oversubscribed
# and in other checkout directories must give bit-identical objects,
# interfaces, archives and programs.
# The ladder is three legs: the serial build against a second serial build
# in another directory and a -j64 build, each in a fresh checkout directory
# of its own; the reference then rebuilds after a marker edit and its revert,
# and that rebuild is held to the reference as well.  The legs run on one machine per platform
# (util/cabal-ladder.sh run, which hashes every leg and gives the verdict), so
# a difference is the build's and not two runner images'.  From GHC 9.12 the
# legs vary GHC's own parallelism as well as cabal's: that is where
# -fobject-determinism exists and cabal.project compiles in parallel.  Below
# it GHC compiles serially, and the legs vary cabal's package jobs and the
# checkout directory.
# It runs on pull requests that touch the build and on a dispatch.

on:
  pull_request:
    paths:
      - cabal.project
      - bsc.cabal
      - SetupHooks.hs
      - util/cabal-ladder.sh
      - src/**
      - GNUmakefile
      - .github/workflows/cabal.yml
  workflow_dispatch:
    inputs:
      ghc_version:
        description: GHC version, as a number (from 9.12 the legs vary GHC's own parallelism)
        required: false
        default: '9.14.1'
        type: string
      platforms:
        description: Runners to build on
        required: false
        default: both
        type: choice
        options: [both, ubuntu, macos]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ladder:
    name: "Ladder ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'ubuntu' && '["ubuntu-24.04"]' || inputs.platforms == 'macos' && '["macos-15"]' || '["ubuntu-24.04","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    # Three legs on one machine, one after another (util/cabal-ladder.sh run).
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo .github/workflows/install_dependencies_ubuntu.sh
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          .github/workflows/install_dependencies_macos.sh
          # The same workaround as build-and-test-macos.yml: a stray tcl.h in
          # /usr/local/include shadows the system Tcl and breaks the bluetcl
          # link.
          rm -f /usr/local/include/tcl.h
      # cabal-install 3.16 speaks the GHC job semaphore protocol v1, GHC's since 9.8; 3.18 speaks
      # only v2, which GHC adds in 9.10.4, 9.12.5, 9.14.2 and 10.0.1, so with it no -jsem is used.
      - name: Install GHC
        uses: haskell/ghcup-setup@v1
        with:
          ghc: ${{ inputs.ghc_version || '9.14.1' }}
          cabal: 3.16.1.0
      # The legs' builds fetch the compiler's Haskell libraries from Hackage,
      # the reference leg first; the others share what it built.
      - name: Update the package index
        run: cabal update
      - name: The ladder
        env:
          OUT: ${{ github.workspace }}/determinism-results
        run: util/cabal-ladder.sh run
      # The lists and the logs, after a failed ladder too.
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: ladder-${{ matrix.os }}
          path: |
            determinism-results/*.sha256
            determinism-results/*.log
            determinism-results/*.rc
          if-no-files-found: error
