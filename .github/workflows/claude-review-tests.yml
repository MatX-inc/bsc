name: Claude Reviewer Tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/claude-review/**'
      - '.github/workflows/claude-review*.yml'
      - 'DEVELOP.md'
      - 'INSTALL.md'
      - 'testsuite/README.md'
      - 'util/haskell-language-server/README.md'
      - 'util/tree-sitter-bluespec/README.md'
  workflow_dispatch:

permissions: {}

jobs:
  authorization-gate:
    if: >-
      (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch'
      && github.ref_name == github.event.repository.default_branch)
    runs-on: ${{ vars.GH_UBUNTU_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      actions: read # GET protected environment configuration
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Checkout default-branch authorization machinery
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Preflight human identities and exact protected-environment User approvers
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          INITIAL_REQUESTER: ${{ github.actor }}
          REQUESTER: ${{ github.triggering_actor || github.actor }}
        run: |
          set -euo pipefail
          if [ ! -f .github/claude-review/scripts/check_authorization.py ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Trusted preflight machinery is absent; tests disabled." >&2
            exit 0
          fi
          metadata="$RUNNER_TEMP/claude-review-environment.json"
          if ! gh api "repos/$REPO/environments/claude-pr-review" > "$metadata"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Protected environment cannot be verified; tests disabled." >&2
            exit 0
          fi
          python3 .github/claude-review/scripts/check_authorization.py \
            --policy .github/claude-review/access-policy.json \
            --author "$PR_AUTHOR" --requester "$REQUESTER" \
            --initial-requester "$INITIAL_REQUESTER" --preflight \
            --environment-file "$metadata" >> "$GITHUB_OUTPUT"

  reviewer-tests:
    needs: authorization-gate
    if: needs.authorization-gate.outputs.ready == 'true'
    environment: claude-pr-review
    runs-on: ${{ vars.GH_UBUNTU_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default-branch membership gate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .review-authorization
          fetch-depth: 1
          persist-credentials: false
      - name: Verify current active MatX-inc membership before PR test code
        id: memberships
        env:
          MATX_ORG_MEMBERS_READ_TOKEN: ${{ secrets.MATX_ORG_MEMBERS_READ_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          INITIAL_REQUESTER: ${{ github.actor }}
          REQUESTER: ${{ github.triggering_actor || github.actor }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 .review-authorization/.github/claude-review/scripts/check_authorization.py \
            --policy .review-authorization/.github/claude-review/access-policy.json \
            --author "$PR_AUTHOR" --requester "$REQUESTER" \
            --initial-requester "$INITIAL_REQUESTER" --memberships >> "$GITHUB_OUTPUT"
      - name: Checkout reviewer under test
        if: steps.memberships.outputs.authorized == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test deterministic reviewer pipeline and authorization boundaries
        if: steps.memberships.outputs.authorized == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s .github/claude-review/scripts -p 'test_*.py'
      - name: Smoke-test packet with current maintained docs
        if: steps.memberships.outputs.authorized == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 .github/claude-review/scripts/make_review_packet.py \
            --base "origin/$BASE_REF" --head HEAD \
            --out "$RUNNER_TEMP/bsc-review-packet.md"
