name: matx-prerelease

# Manually publish the build artifacts of a matx-release run as a GitHub
# pre-release.  Takes the run ID of a completed (successful) matx-release
# run, downloads its Ubuntu and macOS build artifacts, renames the
# tarballs to the bsc-<platform>-YYYYMMDD_N.tar.gz convention, and
# creates a pre-release tagged build-YYYYMMDD-N pointing at the commit
# that the run built.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of the matx-release run to publish (from the run's URL)"
        required: true
      title:
        description: "Release title (defaults to the tag name)"
        required: false
        default: ""

jobs:
  publish:
    name: "Publish pre-release from run"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check the run built this repo and succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          conclusion=$(jq -r .conclusion <<<"$run")
          workflow=$(jq -r .name <<<"$run")
          if [ "$workflow" != "matx-release" ]; then
            echo "Run ${RUN_ID} is a '${workflow}' run, not matx-release" >&2
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "Run ${RUN_ID} concluded '${conclusion}'; only successful runs can be published" >&2
            exit 1
          fi
          jq -r '"HEAD_SHA=\(.head_sha)\nHEAD_BRANCH=\(.head_branch)"' <<<"$run" >> "$GITHUB_ENV"

      # The build artifacts are named for the GHC the run built with, which the
      # run's dispatch chose (matx-release.yml's ghc_version). Read the names
      # off the run rather than hard-coding a GHC here, so publishing needs no
      # second statement of which GHC a release was built with. (A download by
      # pattern would not do: a single match is extracted with no artifact-named
      # directory, so the name is never on disk.)
      - name: Find the build artifacts and the GHC that made them
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --paginate --jq '.artifacts[].name')
          ghc=""
          for pair in "ubuntu-22.04:UBUNTU_ARTIFACT" "macos-15:MACOS_ARTIFACT"; do
            os=${pair%%:*}
            var=${pair#*:}
            matched=$(grep -E "^${os//./\\.} ghc-[^ ]+ build\$" <<<"$names" || true)
            if [ "$(grep -c . <<<"$matched")" -ne 1 ]; then
              echo "Expected exactly one '${os} ghc-<version> build' artifact in run ${RUN_ID}; found: ${matched:-none}" >&2
              exit 1
            fi
            this=${matched#* ghc-}
            this=${this% build}
            if [ -n "$ghc" ] && [ "$this" != "$ghc" ]; then
              echo "The platforms were built with different GHCs: ${ghc} and ${this}" >&2
              exit 1
            fi
            ghc=$this
            echo "${var}=${matched}" >> "$GITHUB_ENV"
          done
          echo "GHC=${ghc}" >> "$GITHUB_ENV"

      - name: Download Ubuntu build artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.UBUNTU_ARTIFACT }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: linux-x86_64
      - name: Download macOS build artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.MACOS_ARTIFACT }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: darwin-aarch64

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TITLE: ${{ inputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          date=$(TZ=America/Los_Angeles date +%Y%m%d)
          try=1
          while gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/build-${date}-${try}" >/dev/null 2>&1; do
            try=$((try + 1))
          done
          tag="build-${date}-${try}"
          mv linux-x86_64/inst.tar.gz "bsc-linux-x86_64-${date}_${try}.tar.gz"
          mv darwin-aarch64/inst.tar.gz "bsc-darwin-aarch64-${date}_${try}.tar.gz"
          gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --target "$HEAD_SHA" \
              --title "${TITLE:-$tag}" \
              --notes "Pre-release of matx-release run [${RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}) (branch \`${HEAD_BRANCH}\`, commit ${HEAD_SHA}), built with GHC ${GHC}." \
              "bsc-linux-x86_64-${date}_${try}.tar.gz" \
              "bsc-darwin-aarch64-${date}_${try}.tar.gz"
          echo "Published pre-release [\`${tag}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}) from run ${RUN_ID} (branch \`${HEAD_BRANCH}\`, GHC ${GHC})" >> "$GITHUB_STEP_SUMMARY"
