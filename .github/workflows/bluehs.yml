name: bluehs runtime

# The bluehs script runtime (util/bluehs): `make install-bluehs` after the
# make build's `make install-src`, on both platforms, then scripts run from
# the installed, relocated tree.  mk-dist.sh builds the cabal project a
# second time and relocates a pruned GHC, the package store and the solver
# libraries; this is the one check of that relocation on macOS.  A pull
# request that touches the runtime runs it.

on:
  pull_request:
    paths:
      - util/bluehs/**
      - GNUmakefile
      - src/comp/make-ghc-pkg-info.sh
      - .github/workflows/bluehs.yml
  workflow_dispatch:
    inputs:
      ghc_version:
        description: GHC version (the one the distribution ships)
        required: false
        default: '9.14.1'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bluehs:
    name: "bluehs ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo .github/workflows/install_dependencies_ubuntu.sh
          # mk-dist.sh rewrites the shipped libraries' search paths
          sudo apt-get install -y patchelf cpio
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          .github/workflows/install_dependencies_macos.sh
          # The same workaround as build-and-test-macos.yml: a stray tcl.h in
          # /usr/local/include shadows the system Tcl and breaks the bluetcl
          # link.
          rm -f /usr/local/include/tcl.h
      # cabal-install 3.16: the Hooks setup-depends Cabal ^>=3.16 needs 3.16 or
      # later, and 3.16 speaks the GHC job semaphore protocol v1 that GHC 9.8
      # through 9.14.1 implement (3.18 speaks only v2, GHC 9.14.2 and 10.2 on).
      - name: Install GHC
        uses: haskell/ghcup-setup@v1
        with:
          ghc: ${{ inputs.ghc_version || '9.14.1' }}
          cabal: 3.16.1.0
      # The make build compiles with -package flags, so its dependencies
      # must be registered with the compiler.
      - name: Install Haskell dependencies
        run: |
          cabal update
          cabal v1-install old-time regex-compat split strict-concurrency syb
      - name: Build and install bsc (make)
        run: |
          case "${{ runner.os }}" in
            Linux) CORES=$(nproc); MEM=5G ;;
            *)     CORES=$(sysctl -n hw.ncpu); MEM=4500M ;;
          esac
          make -j "$CORES" GHCJOBS=2 GHCRTSFLAGS="+RTS -M$MEM -A128m -RTS" install-src
      - name: Install the bluehs runtime
        run: make install-bluehs
      - name: Run scripts from the installed tree
        run: |
          set -x
          inst/bluehs/bin/bluehs dumpbo inst/lib/Libraries/Prelude.bo | head -3
          # a script of one's own, split across a module directory
          mkdir -p probe/Mod
          cat > probe/Mod/Hello.hs <<'EOT'
          module Mod.Hello (hello) where
          import Version (bscVersionStr)
          hello :: String
          hello = "bluehs: " ++ bscVersionStr True
          EOT
          cat > probe/main.hs <<'EOT'
          import Mod.Hello (hello)
          main :: IO ()
          main = putStrLn hello
          EOT
          inst/bluehs/bin/bluehs -iprobe probe/main.hs
          du -sh inst/bluehs
          ls inst/bluehs/scripts
