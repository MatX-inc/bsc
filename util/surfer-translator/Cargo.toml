# Surfer translator plugin for Bluesim waveform dumps.  Built as a
# WebAssembly module for Surfer's extism plugin interface:
#
#   cargo build --release --target wasm32-unknown-unknown
#
# and installed by copying (or linking)
# target/wasm32-unknown-unknown/release/bsc_wave_translator.wasm into a
# .surfer/translators/ directory that Surfer searches.
[package]
name = "bsc_wave_translator"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The plugin ABI types, from the MatX Surfer fork's branch that has the
# variable-hiding and source-file fields the plugin emits
surfer-translation-types = { git = "https://github.com/MatX-inc/surfer.git", branch = "william/bluespec-support", features = ["wasm_plugins"] }

[profile.release]
opt-level = "s"
lto = true

# Stand-alone, whatever directory tree it is placed in
[workspace]
