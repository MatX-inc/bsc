[package]
name = "trs-interp"
description = "Reference interpreter over BIR: the differential oracle (DESIGN.md P1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
trs-ir = { path = "../trs-ir" }
trs-codegen = { path = "../trs-codegen", optional = true }
libloading = "0.8"
libc = "0.2"
# PlanA bake: prime()'s derived schedule serialized into AOT artifacts
serde = { workspace = true }
bincode = { workspace = true }

[build-dependencies]
# vendored libfst (FST wave sink; see build.rs)
cc = "1"

[features]
# AOT artifact loading (libloading + the trs-codegen ABI types): what a
# slim, LLVM-free runtime needs to run `trs link` artifacts at full
# speed.  No compilation tier — an artifact that fails its load gates
# falls back to the interpreter.
aot = ["dep:trs-codegen"]
# hybrid JIT: eligible rules run as LLVM-compiled functions inside the
# interpreter's event loop (TRS_JIT=1 at runtime; needs llvm-18-dev),
# plus artifact EMISSION (trs link) and the in-process compile fallback
jit = ["aot", "trs-codegen/llvm"]
