[package]
name = "trs-capi"
description = "Bluesim kernel C API (bk_*) on the trs interpreter: a drop-in model .so for bluetcl's `sim` command"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# staticlib: `trs link --interactive` links this with a generated
# shim object (exporting new_MODEL_<top>) into <out>.so; rlib for tests
crate-type = ["staticlib", "rlib"]

[dependencies]
trs-ir = { path = "../trs-ir" }
trs-interp = { path = "../trs-interp" }
libc = "0.2"

[features]
# default ON: `sim run`/`sim runto` execute at hybrid-JIT speed between
# interactive stops (state is edge-coherent for symbol peeks).  A lean
# LLVM-free runtime that still loads AOT artifacts at full speed builds
# with --no-default-features --features aot (the slim libtrs_rt.so).
default = ["jit"]
aot = ["trs-interp/aot"]
jit = ["aot", "trs-interp/jit"]
