[package]
name = "bsim2"
description = "Bluesim2 driver: link planner, JIT/AOT builder, native runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bsim2"
path = "src/main.rs"

[dependencies]
bsim2-ir = { path = "../bsim2-ir" }
bsim2-kernel = { path = "../bsim2-kernel" }
bsim2-rt = { path = "../bsim2-rt" }
bsim2-wave = { path = "../bsim2-wave" }
bsim2-codegen = { path = "../bsim2-codegen" }

[features]
llvm = ["bsim2-codegen/llvm"]
